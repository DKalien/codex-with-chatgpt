<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>C2C Companion</title>
<style>
body { margin:0; width:360px; font:14px/1.5 system-ui,sans-serif; background:#141820; color:#e8eaed; }
main { padding:16px; display:grid; gap:10px; } h1 { font-size:18px; margin:0; } p { margin:0; }
label { display:grid; gap:4px; } select,textarea,button { box-sizing:border-box; width:100%; padding:8px; border:1px solid #566173; border-radius:6px; background:#222b39; color:inherit; font:inherit; }
textarea { resize:vertical; } button { cursor:pointer; } button:disabled { opacity:.5; cursor:wait; } .primary { background:#175fc7; }
.note { color:#b9c4d5; font-size:12px; } #error { color:#ffada7; white-space:pre-wrap; overflow-wrap:anywhere; } a { color:#a8c7fa; }
</style>
</head>
<body><main>
<h1>C2C Companion</h1>
<label for="project">项目<select id="project"><option value="">请选择项目</option></select></label>
<p id="status" role="status">正在读取项目…</p>
<p id="autonomy-status" class="note">自动回流：未开启</p>
<button id="connect" class="primary">连接当前对话</button>
<button id="autonomy">开启自动回流</button>
<p class="note">开启后，将 Codex 执行结果自动回传到连接的 ChatGPT 对话。</p>
<label for="pair-json">配对 JSON<textarea id="pair-json" rows="3" autocomplete="off" spellcheck="false" placeholder="粘贴 Bridge 提供的配对 JSON"></textarea></label>
<button id="grant">授权 Bridge 访问</button>
<button id="pair" class="primary">配对并连接当前对话</button>
<p class="note">配对会登记并选择 JSON 中的项目。密钥仅用于本次弹窗，不会保存。</p>
<p id="error" role="alert"></p>
<button id="refresh">刷新状态</button>
<a id="operations" href="../operations/operations.html" target="_blank" rel="noopener">打开任务面板 →</a>
</main><script type="module" src="lightweight.js"></script></body>
</html>
