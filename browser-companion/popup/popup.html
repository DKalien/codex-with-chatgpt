<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>C2C Companion</title>
  <style>
    body { width: 360px; font: 13px system-ui, sans-serif; margin: 12px; }
    h2 { font-size: 13px; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 4px; }
    li { margin: 4px 0; }
    ul { padding-left: 16px; }
    #msg { color: #b00; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="msg"></div>
  <div id="status"></div>
  <h2>Gateway 设置</h2>
  <input id="origin" placeholder="http://127.0.0.1:48766">
  <input id="token" type="password" placeholder="伴侣 token（c2c companion token）">
  <button id="save">保存</button>
  <h2>项目</h2>
  <ul id="workspaces"></ul>
  <script src="popup.js"></script>
</body>
</html>
